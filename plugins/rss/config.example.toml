# RSS 插件配置模板；复制到主配置旁的 plugins.d/rss/config.toml 后修改。
# 顶层段名必须与插件 config_key 一致：这里是 [rss]。

[rss]
feeds = ["https://www.jiqizhixin.com/rss"]
keywords = ["agent", "llm", "安全"]
interests = "AI 安全、Rust、个人自动化、免费 AI 额度、黑客松与实习机会"
max_items_per_feed = 50
interval_secs = 21600
backend = "pi"
notify = true
digest_mode = "daily"
morning_hour = 8
evening_hour = 21
max_age_days = 2
pool_keyword_filter = true
drop_title_patterns = ["^\\[推广\\]", "^\\[中转站\\]"]

# 「机会类」条目的 id 前缀（可省，缺省就是下面这套）。
#
# 这些源产出的是**有截止日期**的比赛/黑客松/实习/奖学金 —— 价值在截止日，
# 不在新鲜度。插件据此做两件事：
#   1. 候选池封顶（80 条）时**不淘汰**它们；
#   2. 组装日报材料时**优先进**材料（预算不够时丢的是别的条目）。
#
# ⚠️ 2026-11-27 实测：没做这件事时，池子封顶与提示词预算**都按采集时间淘汰**
# —— 机会类条目发布一次、留到截止日，天然排在池子最前部 ⇒ 连续 6 期日报
# 一条机会类都没报（11-27 那期候选 76 条只进了 24 条：5 个有奖金的黑客松
# + 1 条实习一条都没进材料）。
#
# 换新源时照这个格式加前缀即可（与适配器给的 id 前缀一致）。
opportunity_id_prefixes = [
  "wqai-",
  "devpost-",
  "lablab-",
  "df-",
  "xfyun-",
  "hackertrip-",
  "hack123-",
  "gsoc-",
  "lfx-",
  "hackathoncom-",
  "mianling-",
]
