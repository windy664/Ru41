[package]
name = "ru41-plugin-jwxt"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
plugin-entry = []

[dependencies]
# 必须与宿主同一版本（ABI 握手校验 git commit + pkg 版本）。
ru41 = { path = "../.." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "blocking"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
base64 = "0.22"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.9"
thiserror = "2"
png = "0.17"
url = "2"

[dev-dependencies]
tempfile = "3"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
