[package]
name = "ru41-plugin-competitions"
version = "0.1.0"
edition = "2024"
description = "竞赛日程总览（外部插件形态）：多源赛事筛选生成 vault 日程总览"

[lib]
crate-type = ["cdylib"]

[features]
plugin-entry = []

[dependencies]
# 必须与宿主同一版本（ABI 握手校验 git commit + pkg 版本）。
ru41 = { path = "../.." }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
