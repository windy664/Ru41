[package]
name = "ru41-plugin-lecture"
version = "0.1.0"
edition = "2024"
description = "课堂录音附属：QQ 收录音 → ffmpeg 切片 → ASR 转写 → Vault 存档 → agent 整理笔记"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
plugin-entry = []

[dependencies]
# 必须与宿主同一版本（ABI 握手校验 crate 版本 + deps stamp）。
ru41 = { path = "../.." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "multipart"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt"] }
