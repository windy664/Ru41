[package]
name = "ru41-plugin-egress-audit"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
plugin-entry = []

[dependencies]
# 必须与宿主同一版本（ABI 握手校验 git commit + pkg 版本）。
ru41 = { path = "../.." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
