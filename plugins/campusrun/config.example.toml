# 校园跑插件配置模板；复制到 plugins.d/campusrun/config.toml 后修改。
#
# 这个文件在**主配置旁边**的 plugins.d/<插件名>/ 里（段名 = 插件配置键 = campusrun）。
# 别塞进主 toml：worker 用的 ru41-worker.toml 和其他容器的 ru41.toml 不是同一份，
# 塞主 toml 两边会对不上（2026-11-17 踩过）。
#
# 令牌属密钥：优先用环境变量注入（容器 compose 里配 PACE_FORGE_TOKEN）；
# 实在要写在文件里就写 token = "..."（这个文件不进 git，权限给 600）。

[campusrun]
# pace-forge 控制台基址。两个容器不在同一个 compose 网络，
# **容器名 pace-forge 解析不了**，用宿主地址：
#   http://172.20.0.1:9999    宿主在 ru41-net 上的网关
#   http://192.168.1.223:9999 宿主 LAN IP
base_url = "http://172.20.0.1:9999"

# 控制台令牌：环境变量名（默认 PACE_FORGE_TOKEN）；或直接写 token = "..."。
token_env = "PACE_FORGE_TOKEN"
# token = "2e1be851ea9d71e32a3b861b120e0d41"

# 单次请求超时（秒），默认 15。
timeout_secs = 15

# 是否允许**真的提交**跑步记录（写操作）。默认 false。
# 关着时 `campusrun submit` 只做预演、不会提交。
# 打开后仍要两步：`submit` 登记待确认 → 用户明确同意 → `confirm <口令>` 才提交。
allow_submit = false

# 配速区间（分/km），默认 5.5~6.6（**你给的推荐参数**，原样用，不夹范围）。
# 时长 = 距离 × 这个区间里**随机**取的一个配速（照抄控制台 autoDur，下限 3 分钟）；
# 服务端自己的默认时长是固定 720 秒、不按距离算，所以这层必须自己算。
#
# **pace_min 要压住任务的最短时长**：学校的规则里有「跑N分钟以上」（实测见过
# 5/6/7/18 分钟，按任务变），但这条是学校在判分时执行的，pace-forge 的
# preflight **不查**它 —— 实测 399 秒那条 preflight 全过，最后被学校判
# complete=false；426 秒那条才通过。
#
# 时长是**算出来的**：距离 × 随机配速（区间内取一个）。所以下限要按
# 「当前要跑的距离」反推：跑 3 km 要过 18 分钟线 → 下限 ≥ 18/3 = 6.0，
# 取 6.1（时长下限 18.3 分钟）。**换任务/换距离要跟着改这里**。
# pace_min = 6.1
# pace_max = 6.6

# 海拔区间（米）：校园实测海拔带。不发就用工具默认的 150±8。
alt_min = 15
alt_max = 45

# 什么时候跑：**不在配置里**。
# 由 agent 从对话里读出时态，再按请求传给插件：
#   不带时间参数          = 当天随机、几天前 0（**用户给的推荐参数**，默认档）
#   --ago 30              = 补跑 30 分钟前那次
#   --at 09:00 [--days 1] = 补跑今天/昨天九点那次
#   --rand [--days 2]     = 补跑前天某个随机时刻（时刻由服务端算）
#   --now                 = 就当刚跑完（工具/Web 端的默认档）

# 提交后的静默窗口（秒），默认 600。
# 「上次提交」的时刻读**服务端**的 lastSubmitMs（/api/accounts）——从 Web 控制台
# 交的那次也算数，插件不自己另记一本。这里配的只是**间隔多长**：服务端的间隔
# 阈值没在 API 里暴露，所以这是个保守的防重提交值，不是服务端说的数。
# silence_secs = 600

# 待确认提交的有效期（秒），默认 900。
# confirm_ttl_secs = 900

# 注意：**门槛不在这儿配**。距离/时长/配速/点位的判定都在服务端：
# - 距离门槛 ← plan 返回的 policy.minDistance
# - 其余 ← pace-forge 的 preflight
# - 上次过没过 ← 记录详情的 reasonList
# 各门课要求不同（实测有 1.00km/7分钟，也有 1.50km/6分钟），写死会误判。
