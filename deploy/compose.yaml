x-ru41: &ru41-common
  image: ru41:local
  build:
    context: ..
    dockerfile: Dockerfile
  init: true
  restart: unless-stopped

x-ru41-volumes: &ru41-volumes
  - ../ru41.toml:/etc/ru41/ru41.toml:ro
  - ../.ru41:/data

services:
  worker:
    <<: *ru41-common
    volumes:
      - ../ru41.toml:/etc/ru41/ru41.toml:ro
      - ../.ru41:/data
      - ${RU41_CODEX_HOME:-../.ru41/codex}:/home/node/.codex
    command:
      - --config
      - /etc/ru41/ru41.toml
      - --db
      - /data/state.db
      - worker
      - --runs-dir
      - /data/runs

  notify:
    <<: *ru41-common
    profiles: [notify]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "notify"]

  qq:
    <<: *ru41-common
    profiles: [qq]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "qq", "run"]

  papers:
    <<: *ru41-common
    profiles: [papers]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "papers", "run"]

  rss:
    <<: *ru41-common
    profiles: [rss]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "rss", "run"]

  ecard:
    <<: *ru41-common
    profiles: [ecard]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "ecard", "run"]

  chaoxing:
    <<: *ru41-common
    profiles: [chaoxing]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "chaoxing", "run"]

  todo:
    <<: *ru41-common
    profiles: [todo]
    volumes: *ru41-volumes
    command:
      - "--config"
      - "/etc/ru41/ru41.toml"
      - "--db"
      - "/data/state.db"
      - todo
      - remind
      - "--channel"
      - "qq"
      - "--target"
      - "${RU41_TODO_NOTIFY_TARGET:?set RU41_TODO_NOTIFY_TARGET, e.g. user:openid}"

  # Obsidian 闭环：qq（/记一下）与 worker（执行整理任务）也需挂载 Vault。
  obsidian:
    <<: *ru41-common
    profiles: [obsidian]
    volumes:
      - ../ru41.toml:/etc/ru41/ru41.toml:ro
      - ../.ru41:/data
      - ${RU41_VAULT_PATH:?set RU41_VAULT_PATH to the vault clone dir}:/vault
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "obsidian", "run"]

  # 博客发布管线：Vault 待发布目录 → 校验 → 博客仓库 _posts → 推送。
  # 发布后回写 Vault（移动 Pending → Published），因此也要挂载 Vault 与 git 凭据。
  blog:
    <<: *ru41-common
    profiles: [blog]
    volumes:
      - ../ru41.toml:/etc/ru41/ru41.toml:ro
      - ../.ru41:/data
      - ${RU41_VAULT_PATH:?set RU41_VAULT_PATH to the vault clone dir}:/vault
      - ${RU41_BLOG_PATH:?set RU41_BLOG_PATH to the blog repo clone dir}:/blog
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "blog", "run"]

  serve:
    <<: *ru41-common
    profiles: [api]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "serve", "--listen", "0.0.0.0:4141"]
    ports:
      - "127.0.0.1:4141:4141"
