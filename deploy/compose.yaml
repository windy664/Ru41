x-ru41: &ru41-common
  image: ru41:local
  build:
    context: ..
    dockerfile: Dockerfile
  init: true
  restart: unless-stopped
  # agent 在容器里裸跑 `ru41 jwxt classes` 等命令时，靠这两个变量拿到
  # 正确的配置与数据库（clap env 兜底），不必记得带 --config/--db。
  environment:
    RU41_CONFIG: /etc/ru41/ru41.toml
    RU41_DB: /data/state.db

x-ru41-volumes: &ru41-volumes
  - ../ru41.toml:/etc/ru41/ru41.toml:ro
  - ../.ru41:/data

services:
  worker:
    <<: *ru41-common
    volumes:
      - ../ru41.toml:/etc/ru41/ru41.toml:ro
      - ../.ru41:/data
      - ${RU41_CODEX_HOME:-../.ru41/codex-home}:/home/node/.codex
    # CODEX_HOME 默认在镜像里指向 /data/codex（.ru41/codex 由容器以 root 创建，
    # 部署用户的 uid 写不进去）；改挂部署用户持有的 codex-home（config.toml + auth.json）。
    environment:
      CODEX_HOME: /home/node/.codex
    command:
      - --config
      - /etc/ru41/ru41.toml
      - --db
      - /data/state.db
      - worker
      - --runs-dir
      - /data/runs

  notify:
    <<: *ru41-common
    profiles: [notify]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "notify"]

  qq:
    <<: *ru41-common
    profiles: [qq]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "qq", "run"]

  papers:
    <<: *ru41-common
    profiles: [papers]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "papers", "run"]

  rss:
    <<: *ru41-common
    profiles: [rss]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "rss", "run"]

  ecard:
    <<: *ru41-common
    profiles: [ecard]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "ecard", "run"]

  chaoxing:
    <<: *ru41-common
    profiles: [chaoxing]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "chaoxing", "run"]

  jwxt:
    <<: *ru41-common
    profiles: [jwxt]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "jwxt", "run"]

  chaoxing-work:
    <<: *ru41-common
    profiles: [chaoxing]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "schedule", "run", "chaoxing-work"]

  todo:
    <<: *ru41-common
    profiles: [todo]
    volumes: *ru41-volumes
    command:
      - "--config"
      - "/etc/ru41/ru41.toml"
      - "--db"
      - "/data/state.db"
      - todo
      - remind
      - "--channel"
      - "qq"
      - "--target"
      - "${RU41_TODO_NOTIFY_TARGET:?set RU41_TODO_NOTIFY_TARGET, e.g. user:openid}"

  # YouTube 英语学习闭环：频道轮询（出预习单）+ 复习闭环（词块间隔重复 + 后测）。
  # 镜像需含 yt-dlp；两个 job 各自常驻（内部按间隔幂等轮询）。
  youtube:
    <<: *ru41-common
    profiles: [youtube]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "schedule", "run", "youtube"]

  youtube-review:
    <<: *ru41-common
    profiles: [youtube]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "schedule", "run", "youtube-review"]

  # 课程提醒（课前 20 分钟）：独立的 PollJob，启动时补发停机期间错过的课。
  # 与 todo-remind 分离：todo 只管 todo，课程提醒走自己的调度。
  class-remind:
    <<: *ru41-common
    profiles: [jwxt]
    volumes: *ru41-volumes
    command:
      - "--config"
      - "/etc/ru41/ru41.toml"
      - "--db"
      - "/data/state.db"
      - schedule
      - run
      - class-remind

  # Obsidian 闭环：qq（/记一下）与 worker（执行整理任务）也需挂载 Vault。
  obsidian:
    <<: *ru41-common
    profiles: [obsidian]
    volumes:
      - ../ru41.toml:/etc/ru41/ru41.toml:ro
      - ../.ru41:/data
      - ${RU41_VAULT_PATH:?set RU41_VAULT_PATH to the vault clone dir}:/vault
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "obsidian", "run"]

  # 博客发布管线：Vault 待发布目录 → 校验 → 博客仓库 _posts → 推送。
  # 发布后回写 Vault（移动 Pending → Published），因此也要挂载 Vault 与 git 凭据。
  blog:
    <<: *ru41-common
    profiles: [blog]
    volumes:
      - ../ru41.toml:/etc/ru41/ru41.toml:ro
      - ../.ru41:/data
      - ${RU41_VAULT_PATH:?set RU41_VAULT_PATH to the vault clone dir}:/vault
      - ${RU41_BLOG_PATH:?set RU41_BLOG_PATH to the blog repo clone dir}:/blog
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "blog", "run"]

  serve:
    <<: *ru41-common
    profiles: [api]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "serve", "--listen", "0.0.0.0:4141"]
    ports:
      - "127.0.0.1:4141:4141"

  # 智慧树作业/考试提醒：.223 sidecar 每晚采集，报告由本地 timer 拉取到 .ru41/zhihuishu/，
  # 本服务按 interval_secs 轮询报告并在临期时 QQ 推送（2026-10-26 形势与政策考试事故后接入）。
  zhihuishu:
    <<: *ru41-common
    profiles: [zhihuishu]
    volumes: *ru41-volumes
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "schedule", "run", "zhihuishu"]

  # 岗位总览：面灵职位表筛选（实习+校招、只留技术岗）→ vault 岗位总览.md，
  # 跨轮合并状态扩窗口（面灵首页只有最新 50 条），[ru41] 自提交，需挂载 Vault。
  jobs:
    <<: *ru41-common
    profiles: [jobs]
    volumes:
      - ../ru41.toml:/etc/ru41/ru41.toml:ro
      - ../.ru41:/data
      - ${RU41_VAULT_PATH:?set RU41_VAULT_PATH to the vault clone dir}:/vault
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "jobs", "run"]

  # 项目计划总览：GSoC 时间线 / LFX 开放项目 / OSPP 节奏卡 → vault 项目总览.md，
  # [ru41] 自提交，需挂载 Vault。
  programs:
    <<: *ru41-common
    profiles: [programs]
    volumes:
      - ../ru41.toml:/etc/ru41/ru41.toml:ro
      - ../.ru41:/data
      - ${RU41_VAULT_PATH:?set RU41_VAULT_PATH to the vault clone dir}:/vault
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "programs", "run"]

  # 科研机会总览：Mitacs/港校暑研/中科院科创等窗口倒计时 → vault 科研总览.md。
  # 纯本地渲染（无网络依赖），[ru41] 自提交，需挂载 Vault。
  research:
    <<: *ru41-common
    profiles: [research]
    volumes:
      - ../ru41.toml:/etc/ru41/ru41.toml:ro
      - ../.ru41:/data
      - ${RU41_VAULT_PATH:?set RU41_VAULT_PATH to the vault clone dir}:/vault
    command: ["--config", "/etc/ru41/ru41.toml", "--db", "/data/state.db", "research", "run"]

  # BOSS 直聘爬取 sidecar：独立 Python 镜像（DrissionPage + chromium），
  # 结果写 /data/boss_jobs.json 供 jobs 模块读取（[sources.jobs] boss_path）。
  # restart: no —— 由宿主机 cron/systemd timer 触发（每天 9 点 / 21 点）：
  #   docker compose -f deploy/compose.yaml run --rm boss-crawler
  # 首次登录：docker compose run --rm boss-crawler python login.py，
  # 二维码截图落在数据目录 boss_login_needed.png。
  boss-crawler:
    build: ../sidecar/boss-crawler
    image: boss-crawler:local
    init: true
    restart: "no"
    profiles: [jobs]
    volumes:
      - ${RU41_BOSS_DATA:-/home/windy2/boss-crawler-data}:/data
    networks:
      - ru41-net

  # 共享无头浏览器（browserless/chromium v2）：JS 重度页面（X、知乎、SPA）的统一
  # 渲染出口。附属与 agent 都用 HTTP API 直连，不再各自背一套 chromium。
  # 注意：旧镜像 browserless/chrome 的 docker hub latest 官方冻结于 2024-02，勿回退。
  browser:
    image: browserless/chromium:latest
    init: true
    restart: unless-stopped
    profiles: [browser]
    # 独立网络 + 固定别名：各容器经 http://ru41-browser:3000 访问，
    # 不把渲染端口暴露到宿主机/局域网。
    networks:
      ru41-net:
        aliases: [ru41-browser]
    environment:
      # 国际站点经 mihomo 代理（docker0 网关）；国内站点 GEOIP 直连。
      HTTP_PROXY: http://172.17.0.1:7890
      HTTPS_PROXY: http://172.17.0.1:7890
      NO_PROXY: localhost,127.0.0.1

networks:
  ru41-net:
    name: ru41-net
