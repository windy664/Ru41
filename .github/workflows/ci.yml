name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RU41_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - name: Secret scan（防手滑提交 token/手机号/openid）
        run: |
          ! grep -rInE "node[0-9a-z]{30,}|1[3-9][0-9]{9}|opXvX5|o6gXt5" \
            --include="*.rs" --include="*.toml" --include="*.md" \
            --exclude-dir=target --exclude=sanitize.rs .
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
