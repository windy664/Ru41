# Ru41 配置样例；复制为 ru41.toml 并填入真实值（ru41.toml 已在 .gitignore 中）。
# 优先级：CLI 参数 > 环境变量 > 本文件 > 内置默认值。

[store]
kind = "sqlite"                 # sqlite 或 postgres
path = ".ru41/state.db"         # sqlite 数据库文件
# url = "postgres://user:pass@localhost:5432/ru41"  # postgres 连接串，也可用 RU41_PG_URL

[worker]
timeout_secs = 300
runs_dir = ".ru41/runs"
sanitize = true                 # Agent 调用前的信息脱敏

[agent.codex]
bin = "codex"
# model = "gpt-5-codex"

[channel.qq]
# 密钥建议用环境变量 RU41_QQ_APP_ID / RU41_QQ_APP_SECRET，避免写进文件。
app_id = ""
app_secret = ""

# HTTP API（ru41 serve）。令牌经环境变量 RU41_API_TOKEN 注入，不写入配置文件。
# listen 地址通过 CLI 参数指定：ru41 serve --listen 127.0.0.1:4141
