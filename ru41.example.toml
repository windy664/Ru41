# Ru41 核心配置样例；复制为 ru41.toml 并填入真实值（ru41.toml 已在 .gitignore 中）。
#
# 这是「核心配置」：agent、存储、worker、渠道、通知、vault、API。
# 附属插件配置不再推荐堆在这里，请看 plugins/<插件>/config.example.toml，
# 复制到 plugins.d/<插件>/config.toml；设备本地覆盖放 config.local.toml。
#
# 优先级：CLI 参数 > 环境变量 > plugins.d/<插件>/config.local.toml
#         > plugins.d/<插件>/config.toml > 本文件 [sources.*] > 内置默认值。

[store]
kind = "sqlite"
path = ".ru41/state.db"
# url = "postgres://user:pass@localhost:5432/ru41"  # 也可用 RU41_PG_URL

[worker]
timeout_secs = 300
runs_dir = ".ru41/runs"
sanitize = true

[todo]
utc_offset_minutes = 480
recent_days = 7
long_term_days = 14

[agent.codex]
bin = "codex"
# model = "gpt-5.2-codex"
# output_schema = false
# config_overrides = [
#   'model_catalog_json="/absolute/path/model-catalogs.json"',
#   'web_search="disabled"',
# ]

# 自定义模型提供方（可选）：让 codex 走 OpenAI Responses 兼容端点。
# [agent.codex.provider]
# id = "openrouter"
# name = "OpenRouter"
# base_url = "https://openrouter.ai/api/v1"
# api_key_env = "OPENROUTER_API_KEY"
# wire_api = "responses"

# Pi 底座（Anthropic 协议端点，如 minimax/MiniMax-M3）。
# [agent.pi]
# enabled = true
# model = "minimax/MiniMax-M3"
# provider = "minimax"
# base_url = "https://api.minimax.io/anthropic"
# api = "anthropic-messages"
# api_key_env = "MINIMAX_API_KEY"
# fallback_models = ["deepseek/deepseek-chat"]
# tools = "read,write,edit,bash"
# extensions = ["/home/node/.pi/agent/npm/node_modules/pi-chrome-use/extensions/browser-execute.ts"]
#
# [agent.pi.extra_env]
# BU_CDP_WS = "ws://ru41-browser:3000/chromium"

[agent.skills]
# 按 root/<插件>/skills/<技能>/SKILL.md 发现技能；生产通常用镜像/挂载默认值。
roots = ["plugins", "/usr/share/ru41/plugins"]

[channel.qq]
# 密钥建议用环境变量 RU41_QQ_APP_ID / RU41_QQ_APP_SECRET。
app_id = ""
app_secret = ""
# bind_secret = ""
# default_notify_target = "user:你的openid"

[channel.feishu]
# webhook_url = ""  # 建议用 RU41_FEISHU_WEBHOOK_URL

# 默认通知出口：简报类任务终态推送走哪个渠道。
# [notify]
# channel = "qq"   # 或 "feishu"
# silent_sources = ["obsidian"]

# Obsidian Vault 闭环。vault_path 是服务器本地克隆路径（容器内需挂载）。
# [obsidian]
# vault_path = "/vault"
# branch = "master"
# inbox_dir = "00-Inbox-收件箱"
# interval_secs = 300
# notify = true

# 知识库向量索引（衍生数据，可重建）。
# [knowledge]
# db_path = ".ru41/knowledge.db"
# cache_dir = ".ru41/fastembed"

# 用量价格（人民币 / 百万 token）；缺省用内置 MiniMax-M3 参考价。
# [pricing]
# input_cny_per_million = 2.16
# output_cny_per_million = 8.64
# cache_read_cny_per_million = 0.432

# HTTP API（ru41 serve）。令牌优先用 RU41_API_TOKEN。
[api]
# listen = "127.0.0.1:4141"

# 插件 .so 目录与总开关。
# [plugins]
# dir = "/etc/ru41/plugins"
# enabled = true

# 兼容说明：旧的 [sources.<插件>] 仍会生效，但新配置优先放
# plugins.d/<插件>/config.toml；两边同时存在时插件目录配置覆盖这里。
