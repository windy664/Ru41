# Ru41 配置样例；复制为 ru41.toml 并填入真实值（ru41.toml 已在 .gitignore 中）。
# 优先级：CLI 参数 > 环境变量 > 本文件 > 内置默认值。

[store]
kind = "sqlite"                 # sqlite 或 postgres
path = ".ru41/state.db"         # sqlite 数据库文件
# url = "postgres://user:pass@localhost:5432/ru41"  # postgres 连接串，也可用 RU41_PG_URL

[worker]
timeout_secs = 300
runs_dir = ".ru41/runs"
sanitize = true                 # Agent 调用前的信息脱敏

[todo]
utc_offset_minutes = 480        # 本地时区固定偏移；默认 +08:00
recent_days = 7                 # 今日之后归入“近期”的窗口
long_term_days = 14             # 超过该窗口的已排期事项归入“长期”

[agent.codex]
# bin = "codex"
# model = "gpt-5.2-codex"
# output_schema = false             # 供应商不接受 json_schema 时，改用 prompt 约束 + Ru41 校验
# config_overrides = [              # 附加 codex -c 配置；路径需用绝对路径
#   'model_catalog_json="/absolute/path/model-catalogs.json"',
#   'web_search="disabled"',
# ]

# 自定义模型提供方（可选）：让 codex 走 OpenAI Responses 兼容端点。
# 密钥从 api_key_env 指定的环境变量读取（由 codex 子进程自读），不写进本文件。
# [agent.codex.provider]
# id = "openrouter"                 # provider 标识
# name = "OpenRouter"               # 展示名（缺省同 id）
# base_url = "https://openrouter.ai/api/v1"
# api_key_env = "OPENROUTER_API_KEY"
# wire_api = "responses"            # Codex 0.163+ 仅支持 responses；chat 仅用于旧版
bin = "codex"
# model = "gpt-5-codex"

[agent.skills]
# 按 root/<module>/skills/<skill>/SKILL.md 发现技能；缺省同时尝试以下两个目录。
roots = ["src/modules", "/etc/ru41/modules"]

[channel.qq]
# 密钥建议用环境变量 RU41_QQ_APP_ID / RU41_QQ_APP_SECRET，避免写进文件。
app_id = ""
app_secret = ""
# 「绑定」命令的口令；也可用环境变量 RU41_QQ_BIND_SECRET。留空则绑定功能关闭。
# bind_secret = ""
# 主动通知的默认目标（[notify] channel = "qq" 时必填）。
# default_notify_target = "user:你的openid"

[channel.feishu]
# 自定义群机器人 webhook（含 token，建议用环境变量 RU41_FEISHU_WEBHOOK_URL）。
# webhook_url = ""

# 默认通知出口：简报类任务（如论文精选）终态推送走哪个渠道，只有这里需要知道渠道。
# [notify]
# channel = "feishu"

# arXiv 论文追踪（ru41 papers poll/run）。
# [sources.arxiv]
# categories = ["cs.CR", "cs.AI", "cs.CL"]
# keywords = ["prompt injection", "jailbreak", "llm security", "agent"]
# interests = "AI 安全方向本科生，关注 LLM/Agent 安全"
# notify = true

# RSS 信息流追踪（ru41 rss poll/run），模式与论文追踪一致。
# [sources.rss]
# feeds = ["https://www.jiqizhixin.com/rss"]
# keywords = ["agent", "llm", "安全"]
# interests = "AI 安全方向本科生"

# 校园卡水电监控（ru41 ecard poll/run），协议见 docs/ecard-waterfee.md。
# base_url 与 token 只存本地；token 建议用环境变量 RU41_ECARD_TOKEN。
# [sources.ecard]
# base_url = "https://ecarduser.<school>.edu.cn"
# impl_type = ""
# school_area_no = ""
# building_no = ""
# room_num = ""
# power_threshold = 10.0   # 度
# water_threshold = 1.0    # 吨
# interval_secs = 86400

# 智慧树作业提醒：消费 sidecar 采集器写出的报告文件（见 docs/sources-zhihuishu.md）。
# [sources.zhihuishu]
# report_path = ".ru41/zhihuishu/report.json"
# deadline_days = 3        # 截止前 N 天进入每日提醒
# interval_secs = 21600
# notify = true
# vault_task_dirs = "substantive"  # 任务目录策略：all=每个任务建目录；substantive=只有有正文要求/附件的作业才建

# 学习通签到监控：协议端直连，检测待签活动并提醒（见 docs/sources-chaoxing.md）。
# 凭证建议用环境变量 RU41_XXT_PHONE / RU41_XXT_PASSWORD 注入。
# [sources.chaoxing]
# phone = "13800000000"
# password = ""
# interval_secs = 60       # 签到窗口常为 1-2 分钟，默认 60s
# notify = true
# auto_sign = false        # true = agent 模式：发现待签当场自动签（二维码除外）
# work_poll_secs = 1800    # 作业轮询间隔（作业列表请求重，务必低频）
# work_due_days = 3        # 截止前 N 天临期提醒
# work_todo_sync = true    # 未交作业自动进待办、已交自动回勾
# work_vault_sync = true   # 作业清单进 Obsidian（需 [obsidian]）；与智慧树同窗目录即聚合
# vault_course_dir = "01-Courses-课程/2026-Fall-大一上"   # 缺省与 zhihuishu 一致
# work_vault_task_dirs = "substantive"  # 任务目录策略：all=全部；substantive=只为未交作业建目录（学习通说明无正文）
# vault_courses = { "大学英语新视野" = "大学英语" }         # 跨平台同名课程映射到同一目录
# default_lat = 30.000000  # 宿舍纬度：位置/二维码签到的坐标缺省
# default_lon = 114.000000 # 宿舍经度
# default_addr = "宿舍"    # 地址文本（位置签到的 address 参数，教师端可见）
# photo_path = "~/sign.jpg" # 拍照签到默认照片；缺省用内置兜底照片

# 教务课表监控（ru41 jwxt poll/run/login，见 docs/sources-jwxt.md）。
# 统一认证账号经 CAS 单点登录拉课表；首次登录需人工输一次图形验证码。
# 凭证建议用环境变量 RU41_JWXT_USERNAME / RU41_JWXT_PASSWORD 注入。
# [sources.jwxt]
# semester_start = "2026-09-07" # 学期第一周周一：周次推算与明日课表依赖它（教务接口不暴露当前周，必须配置准确）
# interval_secs = 3600          # jwxt run 轮询间隔
# remind_hour = 21              # 每日到点后推明日课表（同日去重）
# daily_remind = true
# sync_schedule = true          # 课表同步到日程（课前15分钟提醒、/日程 可见）；需配 section_times
# section_times = ["08:30","09:25","10:25","11:20","13:30","14:25","15:25","16:20","17:10","18:05","19:00","19:55","20:45","21:35","22:20","23:10"]  # 第1..=16节上课时刻
# notify = true

# Obsidian Vault 闭环（ru41 obsidian poll/run，核心能力）：Git 轮询发现 Inbox 新提交，
# 入队 Agent 整理任务（obsidian-organize skill），成功后自动提交推送。
# vault_path 是服务器本地克隆路径（容器内需挂载）；git 凭据用 credential.helper，不写这里。
# [obsidian]
# vault_path = "/vault"
# branch = "master"
# inbox_dir = "00-Inbox-收件箱"
# interval_secs = 300
# notify = true

# HTTP API（ru41 serve）。令牌经环境变量 RU41_API_TOKEN 注入，不写入配置文件。
# listen 地址通过 CLI 参数指定：ru41 serve --listen 127.0.0.1:4141

[api]
# listen = "127.0.0.1:4141"
# token 也可写在这里；环境变量 RU41_API_TOKEN 优先级更高（推荐）

# 博客发布管线（ru41 blog poll/run）：Vault 的 Published-已发布/ 目录即发布入口。
# 定稿从 Drafts-草稿/ 移入该目录并 git 同步后，服务器自动校验 frontmatter、
# 写入博客仓库 _posts 并推送；文件原地留在已发布目录归档，程序不回写 Vault。
# repo_path 是服务器上的博客仓库克隆（容器内挂载）；推 GitHub 需凭据（git credential helper）。
# [sources.blog]
# repo_path = "/blog"
# branch = "master"
# site_url = "https://windy664.github.io"
# interval_secs = 300
# notify = true
