# ai-planner-sim 的配置（示例）
#
# 复制成 config.toml 后按真实情况改，然后：
#   cargo run --release
#
# ⚠️ 下面的锚点与权重是**假设值**（2026-11-19 演示用）。
#    真实值见 docs/plans/portfolio.md §8 的待补清单。

[term]
start = "2026-11-22"
end = "2027-01-03"

# 整块槽位：来自生产真实课表的空闲形状（周一晚 + 周日上午）
[[blocks]]
weekday = 1        # 1=周一 … 7=周日
start = "19:00"
label = "周一晚"

[[blocks]]
weekday = 7
start = "10:00"
label = "周日上午"

# 碎片段：课间缝（实测一周 90 分钟）
[[fragment_slots]]
weekday = 1
start = "16:50"
minutes = 10

[[fragment_slots]]
weekday = 3
start = "10:20"
minutes = 20

[[fragment_slots]]
weekday = 3
start = "16:50"
minutes = 10

[[fragment_slots]]
weekday = 4
start = "10:20"
minutes = 20

[[fragment_slots]]
weekday = 4
start = "15:20"
minutes = 10

[[fragment_slots]]
weekday = 4
start = "16:50"
minutes = 10

[[fragment_slots]]
weekday = 5
start = "15:20"
minutes = 10

# 记忆层参数（FSRS v7）
card_count = 300
desired_retention = 0.90
block_minutes = 120
seconds_per_card = 10.0
fragment_daily_budget_seconds = 780.0

