[package]
name = "ru41"
version = "0.2.0"
edition = "2024"
description = "Personal automation assistant built with Rust and Codex"
repository = "https://github.com/windy664/Ru41"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
postgres = "0.19"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal", "sync", "fs"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
