[package]
name = "ru41"
version = "0.1.0"
edition = "2024"
description = "Personal automation assistant built with Rust and Codex"
repository = "https://github.com/windy664/Ru41"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
