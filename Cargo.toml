[package]
name = "ru41"
version = "0.2.0"
edition = "2024"
description = "Personal automation assistant built with Rust and Codex"
repository = "https://github.com/windy664/Ru41"
publish = false

[dependencies]
libloading = "0.8"
linkme = "0.3"
anyhow = "1"
num-bigint = "0.4"
num-traits = "0.2"
png = "0.17"
clap = { version = "4.6", features = ["derive", "env"] }
postgres = "0.19"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "blocking"] }
rusqlite = { version = "0.40", features = ["bundled"] }
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
url = "2"
base64 = "0.22"
qrcode = "0.14"
toml_edit = "0.23"
serde = { version = "1", features = ["derive"] }
schemars = { version = "0.8", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
thiserror = "2"
toml = "0.9"
futures-util = "0.3"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal", "sync", "fs"] }
tempfile = "3"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
quick-xml = "0.42.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rqrr = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
fastembed = "7.5.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
