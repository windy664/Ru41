[package]
name = "ru41"
version = "0.2.0"
edition = "2024"
description = "Personal automation assistant built with Rust and Codex"
repository = "https://github.com/windy664/Ru41"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
postgres = "0.19"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
toml = "0.9"
futures-util = "0.3"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "signal", "sync", "fs"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
